name: ROUND61 ACK UFS source and binding validation

on:
  push:
    branches:
      - ai-parallel/stagea-port-until-boot
    paths:
      - ".github/workflows/round61-ack-ufs-validation.yml"
      - "kernel-baseline/round32/0001-dt-bindings-ufs-add-sm8250-compatible.patch.draft"
      - "kernel-baseline/round36/0001-dt-bindings-ufs-allow-sm8250-dual-power-domains.patch.draft"
      - "kernel-baseline/round52/0001-dt-bindings-ufs-vddp-vccq-parent-supplies.patch.draft"
      - "kernel-baseline/round61/patches/**"
      - "kernel-baseline/round61/fixtures/**"
      - "kernel-baseline/round61/tests/**"
      - "kernel-baseline/round61/check_dby_w09_config.py"

permissions:
  contents: write

jobs:
  ack-ufs-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACK_COMMIT: 8ad08f75ddf056e1ee600e1339e0463c5fcbdc9a
      REPORT_REPO: https://github.com/hhdy/matepad11-dby-w09-agent-reports.git
      ACK_REPO: https://github.com/aosp-mirror/kernel_common.git
    steps:
      - name: Fetch the dedicated report branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "$GITHUB_REF_NAME" "$REPORT_REPO" "$RUNNER_TEMP/report"

      - name: Fetch immutable ACK source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/ack"
          git -C "$RUNNER_TEMP/ack" remote add origin "$ACK_REPO"
          git -C "$RUNNER_TEMP/ack" fetch --depth=1 origin "$ACK_COMMIT"
          git -C "$RUNNER_TEMP/ack" checkout --detach FETCH_HEAD
          actual="$(git -C "$RUNNER_TEMP/ack" rev-parse HEAD)"
          printf 'ACK_HEAD=%s\n' "$actual"
          test "$actual" = "$ACK_COMMIT"
          git -C "$RUNNER_TEMP/ack" status --short

      - name: Verify immutable source blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ack"
          check_blob() {
            local path="$1" expected="$2" actual
            actual="$(git rev-parse "HEAD:$path")"
            printf '%s %s\n' "$actual" "$path"
            test "$actual" = "$expected"
          }
          check_blob Documentation/devicetree/bindings/ufs/qcom,ufs.yaml 1dd41f6d5258014d59c8c8005bc54f7994351a52
          check_blob Documentation/devicetree/bindings/ufs/qcom,ufs-common.yaml 962dffcd28b44b3489be5615c75e7270a0c45dc4
          check_blob drivers/ufs/host/ufs-qcom.c a80c6998406dbc88c25dbd9977699ba481207efe
          check_blob drivers/ufs/host/ufs-qcom.h 5f979daabd5323184eeee137cc8ecc076193979e
          check_blob BUILD.bazel 3c8178ebce1f27f2c417e4aeaa00fc7001a96be6

      - name: Apply ordered UFS patches with real git apply
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          ack="$RUNNER_TEMP/ack"
          apply_patch() {
            local patch="$1"
            printf '\n=== git apply --check: %s ===\n' "$patch"
            if ! git -C "$ack" apply --check "$report/$patch"; then
              printf '\n=== failure diagnostics for %s ===\n' "$patch"
              nl -ba "$ack/Documentation/devicetree/bindings/ufs/qcom,ufs.yaml" | sed -n '35,125p' || true
              printf '\n=== exact whitespace around allOf ===\n'
              sed -n '62,68l' "$ack/Documentation/devicetree/bindings/ufs/qcom,ufs.yaml" || true
              printf '\n=== patch hunk bytes ===\n'
              grep -n -A4 '^@@ -64,3 +85,16 @@' "$report/$patch" | od -An -tx1c || true
              git -C "$ack" apply --reject --verbose "$report/$patch" || true
              find "$ack" -name '*.rej' -type f -print -exec cat {} \; || true
              exit 1
            fi
            printf '=== git apply: %s ===\n' "$patch"
            git -C "$ack" apply "$report/$patch"
            git -C "$ack" diff --check
          }
          printf 'Original ROUND32/ROUND57 qcom,ufs.yaml edits are superseded: pinned ACK already selects SM8250 in qcom,sc7180-ufshc.yaml.\n'
          apply_patch kernel-baseline/round36/0001-dt-bindings-ufs-allow-sm8250-dual-power-domains.patch.draft
          apply_patch kernel-baseline/round61/patches/round52-0001-context-corrected.patch
          apply_patch kernel-baseline/round61/patches/round36-corrected-power-domain-range.patch
          apply_patch kernel-baseline/round61/patches/round32-corrected-sc7180-clock-names.patch
          apply_patch kernel-baseline/round61/patches/round33-checkpatch-clean.patch
          apply_patch kernel-baseline/round61/patches/round52-0002-checkpatch-clean.patch
          apply_patch kernel-baseline/round61/patches/round63-0002-qmp-ufs-phy-binding.patch
          apply_patch kernel-baseline/round61/patches/round63-0001-phy-qcom-qmp-ufs-always-on.patch
          printf '\n=== final diff check ===\n'
          git -C "$ack" diff --check
          git -C "$ack" status --short
          git -C "$ack" diff --stat
          git -C "$ack" diff --numstat
          git -C "$ack" diff --binary > "$RUNNER_TEMP/round61-ufs-applied.diff"
          sha256sum "$RUNNER_TEMP/round61-ufs-applied.diff"
          git -C "$ack" diff --binary

      - name: Apply ROUND58 Kleaf target patch
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          ack="$RUNNER_TEMP/ack"
          patch="$report/kernel-baseline/round61/patches/round58-kleaf-target.patch"
          git -C "$ack" apply --check "$patch"
          git -C "$ack" apply "$patch"
          git -C "$ack" diff --check
          git -C "$ack" status --short
          git -C "$ack" diff --stat

      - name: Run strict checkpatch on driver patches
        shell: bash
        run: |
          set -euo pipefail
          ack="$RUNNER_TEMP/ack"
          report="$RUNNER_TEMP/report"
          set +e
          perl "$ack/scripts/checkpatch.pl" --no-tree --no-signoff --strict < "$report/kernel-baseline/round61/patches/round33-checkpatch-clean.patch" > "$RUNNER_TEMP/round33-checkpatch.log" 2>&1
          rc33=$?
          perl "$ack/scripts/checkpatch.pl" --no-tree --no-signoff --strict < "$report/kernel-baseline/round61/patches/round52-0002-checkpatch-clean.patch" > "$RUNNER_TEMP/round52-0002-checkpatch.log" 2>&1
          rc52=$?
          cat "$RUNNER_TEMP/round33-checkpatch.log"
          cat "$RUNNER_TEMP/round52-0002-checkpatch.log"
          perl "$ack/scripts/checkpatch.pl" --no-tree --no-signoff --strict --ignore CAMELCASE < "$report/kernel-baseline/round61/patches/round63-0001-phy-qcom-qmp-ufs-always-on.patch" > "$RUNNER_TEMP/round63-0001-checkpatch.log" 2>&1
          rc63=$?
          cat "$RUNNER_TEMP/round63-0001-checkpatch.log"
          printf 'ROUND33_CHECKPATCH_RC=%s\nROUND52_0002_CHECKPATCH_RC=%s\nROUND63_0001_CHECKPATCH_RC=%s\n' "$rc33" "$rc52" "$rc63"
          if [ "$rc33" -ne 0 ] || [ "$rc52" -ne 0 ] || [ "$rc63" -ne 0 ]; then
            exit 1
          fi

      - name: Validate Kleaf BUILD syntax and config helper tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ack"
          go version
          go install github.com/bazelbuild/buildtools/buildifier@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          buildifier -version
          buildifier -mode=check BUILD.bazel
          report="$RUNNER_TEMP/report"
          PYTHONPATH="$report/kernel-baseline/round61" \
            python3 -m unittest discover \
              -s "$report/kernel-baseline/round61/tests" -v

      - name: Install device-tree schema prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler libyaml-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/dtschema-venv"
          "$RUNNER_TEMP/dtschema-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/dtschema-venv/bin/python" -m pip install "dtschema==2023.9"
          "$RUNNER_TEMP/dtschema-venv/bin/dt-doc-validate" --version || true
          dtc --version

      - name: Run authoritative UFS dt_binding_check
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ack"
          report="$RUNNER_TEMP/report"
          export PATH="$RUNNER_TEMP/dtschema-venv/bin:$PATH"
          export PYTHON="$RUNNER_TEMP/dtschema-venv/bin/python"
          set -o pipefail
          make ARCH=arm64 dt_binding_check \
            DT_SCHEMA_FILES="Documentation/devicetree/bindings/ufs/ufs-common.yaml:Documentation/devicetree/bindings/ufs/qcom,ufs.yaml:Documentation/devicetree/bindings/ufs/qcom,ufs-common.yaml:Documentation/devicetree/bindings/ufs/qcom,sc7180-ufshc.yaml:Documentation/devicetree/bindings/phy/qcom,sc8280xp-qmp-ufs-phy.yaml" \
            2>&1 | tee "$RUNNER_TEMP/round61-dt-binding-check.log"
          dt-doc-validate -u Documentation/devicetree/bindings \
            Documentation/devicetree/bindings/ufs/ufs-common.yaml \
            Documentation/devicetree/bindings/ufs/qcom,ufs.yaml \
            Documentation/devicetree/bindings/ufs/qcom,ufs-common.yaml \
            Documentation/devicetree/bindings/ufs/qcom,sc7180-ufshc.yaml \
            Documentation/devicetree/bindings/phy/qcom,sc8280xp-qmp-ufs-phy.yaml
          yamllint -f parsable -c Documentation/devicetree/bindings/.yamllint \
            Documentation/devicetree/bindings/ufs/ufs-common.yaml \
            Documentation/devicetree/bindings/ufs/qcom,ufs.yaml \
            Documentation/devicetree/bindings/ufs/qcom,ufs-common.yaml \
            Documentation/devicetree/bindings/ufs/qcom,sc7180-ufshc.yaml \
            Documentation/devicetree/bindings/phy/qcom,sc8280xp-qmp-ufs-phy.yaml
          test -f Documentation/devicetree/bindings/processed-schema.json
          test -s Documentation/devicetree/bindings/ufs/qcom,ufs.example.dtb
          find Documentation/devicetree/bindings/ufs -maxdepth 1 \
            -name 'qcom,ufs*.example.dtb' -print
          find Documentation/devicetree/bindings/phy -maxdepth 1 \
            -name 'qcom,sc8280xp-qmp-ufs-phy.example.dtb' -print
          set +e
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            Documentation/devicetree/bindings/ufs/qcom,ufs.example.dtb \
            > "$RUNNER_TEMP/round61-ufs-example-validation.log" 2>&1
          ufs_example_rc=$?
          set -e
          cat "$RUNNER_TEMP/round61-ufs-example-validation.log"
          printf 'ROUND61_UFS_EXAMPLE_DT_VALIDATE_RC=%s (nonzero remains a Phase-B blocker)\n' "$ufs_example_rc"
          printf '\n=== dt-validate CLI ===\n'
          dt-validate --help
          cp Documentation/devicetree/bindings/processed-schema.json "$RUNNER_TEMP/round61-processed-schema.json"
          sha256sum "$RUNNER_TEMP/round61-processed-schema.json" > "$RUNNER_TEMP/round61-processed-schema.sha256"
          ufs_fixture_dir="$RUNNER_TEMP/round61-ufs-fixtures"
          python3 "$report/kernel-baseline/round61/tests/generate_round61_ufs_fixtures.py" --out "$ufs_fixture_dir"
          for source in "$ufs_fixture_dir"/*.dts; do
            name="$(basename "$source" .dts)"
            dtc -Wno-unit_address_vs_reg -I dts -O dtb -o "$ufs_fixture_dir/$name.dtb" "$source"
          done
          dt_validate_expected_failure() {
            name="$1"
            expected="$2"
            log="$RUNNER_TEMP/$name-validation.log"
            set +e
            dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
              "$ufs_fixture_dir/$name.dtb" > "$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            if [ "$rc" -ne 0 ] && [ ! -s "$log" ]; then
              echo "dt-validate failed before producing the expected diagnostic for $name"
              exit 1
            fi
            grep -Fqi "$expected" "$log"
          }
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$ufs_fixture_dir/ufs-sm8250-1-domain-valid.dtb" \
            > "$RUNNER_TEMP/ufs-sm8250-1-domain-valid-validation.log" 2>&1
          cat "$RUNNER_TEMP/ufs-sm8250-1-domain-valid-validation.log"
          test ! -s "$RUNNER_TEMP/ufs-sm8250-1-domain-valid-validation.log"
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$ufs_fixture_dir/ufs-sm8250-2-domains-valid.dtb" \
            > "$RUNNER_TEMP/ufs-sm8250-2-domains-valid-validation.log" 2>&1
          cat "$RUNNER_TEMP/ufs-sm8250-2-domains-valid-validation.log"
          test ! -s "$RUNNER_TEMP/ufs-sm8250-2-domains-valid-validation.log"
          dt_validate_expected_failure ufs-sm8250-7-clock-names-invalid clock-names
          dt_validate_expected_failure ufs-sm8250-9-clock-names-invalid clock-names
          dt_validate_expected_failure ufs-sm8250-3-domains-invalid power-domains
          dt_validate_expected_failure ufs-sm8150-2-domains-invalid power-domains
          dt_validate_expected_failure ufs-sm8250-vddp-missing-load-invalid qcom,vddp-ref-clk-max-microamp
          dt_validate_expected_failure ufs-sm8250-vccq-parent-missing-load-invalid qcom,vccq-parent-max-microamp
          dt_validate_expected_failure ufs-sm8250-vddp-zero-load-invalid qcom,vddp-ref-clk-max-microamp
          dt_validate_expected_failure ufs-sm8250-vccq-parent-zero-load-invalid qcom,vccq-parent-max-microamp
          printf 'ROUND61_UFS_FIXTURES=PASS (SM8250 1/2 domains; 7/9 clocks, 3 domains, non-SM8250 dual domain, supply/load pair and zero load rejected)\n'
          fixture_dir="$report/kernel-baseline/round61/fixtures"
          for fixture in round63-phy-legacy-no-property round63-phy-always-on-valid round63-phy-always-on-invalid-type; do
            dtc -Wno-unit_address_vs_reg -I dts -O dtb \
              -o "$RUNNER_TEMP/$fixture.dtb" "$fixture_dir/$fixture.dts"
          done
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$RUNNER_TEMP/round63-phy-legacy-no-property.dtb"
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$RUNNER_TEMP/round63-phy-always-on-valid.dtb"
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$RUNNER_TEMP/round63-phy-legacy-no-property.dtb" \
            > "$RUNNER_TEMP/round63-phy-legacy-validation.log" 2>&1
          cat "$RUNNER_TEMP/round63-phy-legacy-validation.log"
          test ! -s "$RUNNER_TEMP/round63-phy-legacy-validation.log"
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$RUNNER_TEMP/round63-phy-always-on-valid.dtb" \
            > "$RUNNER_TEMP/round63-phy-positive-validation.log" 2>&1
          cat "$RUNNER_TEMP/round63-phy-positive-validation.log"
          test ! -s "$RUNNER_TEMP/round63-phy-positive-validation.log"
          set +e
          dt-validate -s Documentation/devicetree/bindings/processed-schema.json \
            "$RUNNER_TEMP/round63-phy-always-on-invalid-type.dtb" \
            > "$RUNNER_TEMP/round63-phy-negative-validation.log" 2>&1
          negative_rc=$?
          set -e
          cat "$RUNNER_TEMP/round63-phy-negative-validation.log"
          if [ "$negative_rc" -ne 0 ] && [ ! -s "$RUNNER_TEMP/round63-phy-negative-validation.log" ]; then
            echo "dt-validate failed before producing the expected PHY property diagnostic"
            exit 1
          fi
          grep -qi 'vdda-phy-always-on' "$RUNNER_TEMP/round63-phy-negative-validation.log"
          printf 'ROUND63_PHY_FIXTURES=PASS (legacy absent, boolean present, malformed type rejected)\n'
          if [ -s "$RUNNER_TEMP/round61-ufs-example-validation.log" ]; then
            echo "The extracted qcom,ufs.example.dtb contains unresolved external provider phandles (for example &gcc); direct dt-validate output is retained as diagnostic only."
            echo "Authoritative positive/negative schema gates are the self-contained fixtures above, which define provider #*-cells and are validated against the processed schema."
          fi
          printf 'ROUND61_UPSTREAM_EXAMPLE_COMPILE=PASS (dt_binding_check extracted and compiled the example; unresolved external provider references are not used as standalone DTB validation fixtures)\n'

      - name: Summarize validation evidence
        if: always()
        shell: bash
        run: |
          printf 'ACK_COMMIT=%s\n' "$ACK_COMMIT"
          if [ -d "$RUNNER_TEMP/ack/.git" ]; then
            git -C "$RUNNER_TEMP/ack" rev-parse HEAD
            git -C "$RUNNER_TEMP/ack" status --short
          fi
          if [ -f "$RUNNER_TEMP/round61-ufs-applied.diff" ]; then
            sha256sum "$RUNNER_TEMP/round61-ufs-applied.diff"
          fi
          if [ -f "$RUNNER_TEMP/round61-dt-binding-check.log" ]; then
            sha256sum "$RUNNER_TEMP/round61-dt-binding-check.log"
          fi

      - name: Publish validation evidence to the dedicated branch
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report"
          if [ ! -d "$report/.git" ]; then
            echo "Report checkout unavailable; cannot publish validation summary."
            exit 0
          fi
          out="$RUNNER_TEMP/hosted-ufs-validation-latest.md"
          {
            echo "# ROUND61 hosted UFS / ROUND63 PHY validation"
            echo
            echo "- Workflow commit: $GITHUB_SHA"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Job status: $JOB_STATUS"
            echo "- Fixed ACK commit: $ACK_COMMIT"
            echo
            if [ -f "$RUNNER_TEMP/round61-processed-schema.sha256" ]; then
              echo
              echo "## Processed schema SHA-256"
              cat "$RUNNER_TEMP/round61-processed-schema.sha256"
            fi
            echo "## Patch application"
            if [ -f "$RUNNER_TEMP/round61-ufs-applied.diff" ]; then
              sha256sum "$RUNNER_TEMP/round61-ufs-applied.diff"
            else
              echo "Applied diff not produced; inspect job log."
            fi
            if [ -d "$RUNNER_TEMP/ack/.git" ]; then
              echo "ACK HEAD: $(git -C "$RUNNER_TEMP/ack" rev-parse HEAD)"
              git -C "$RUNNER_TEMP/ack" status --short
              git -C "$RUNNER_TEMP/ack" diff --stat
            fi
            for log in round63-phy-legacy-validation.log round63-phy-positive-validation.log ufs-sm8250-1-domain-valid-validation.log ufs-sm8250-2-domains-valid-validation.log round33-checkpatch.log round52-0002-checkpatch.log round63-0001-checkpatch.log round61-dt-binding-check.log round61-ufs-example-validation.log round63-phy-negative-validation.log; do
              if [ -f "$RUNNER_TEMP/$log" ]; then
                echo
                echo "## $log"
                tail -n 100 "$RUNNER_TEMP/$log"
              fi
            done
            if [ -f "$RUNNER_TEMP/round61-dt-binding-check.log" ]; then
              echo
              echo "## dt_binding_check log SHA-256"
              sha256sum "$RUNNER_TEMP/round61-dt-binding-check.log"
            fi
          } > "$out"
          git -C "$report" config user.name "github-actions[bot]"
          git -C "$report" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$report" remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3; do
            git -C "$report" fetch origin ai-parallel/stagea-port-until-boot
            git -C "$report" reset --hard FETCH_HEAD
            current="$report/kernel-baseline/round61/hosted-ufs-validation-latest.md"
            existing_id="$(awk -F': ' '/Workflow run ID:/ { print $2; exit }' "$current" 2>/dev/null || true)"
            if [[ "$existing_id" =~ ^[0-9]+$ ]] && (( existing_id > GITHUB_RUN_ID )); then
              echo "A newer UFS validation result already exists (run $existing_id); leaving it intact."
              exit 0
            fi
            cp "$out" "$current"
            git -C "$report" add kernel-baseline/round61/hosted-ufs-validation-latest.md
            if git -C "$report" diff --cached --quiet; then
              exit 0
            fi
            git -C "$report" commit -m "ROUND61: publish hosted UFS and PHY validation evidence"
            if git -C "$report" push origin HEAD:ai-parallel/stagea-port-until-boot; then
              exit 0
            fi
            echo "Branch moved during validation publication; retrying ($attempt/3)."
            sleep 2
          done
          exit 1

      - name: Upload UFS and PHY validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round61-ufs-phy-validation
          path: |
            ${{ runner.temp }}/round61-ufs-applied.diff
            ${{ runner.temp }}/round61-processed-schema.json
            ${{ runner.temp }}/round61-processed-schema.sha256
            ${{ runner.temp }}/round61-dt-binding-check.log
            ${{ runner.temp }}/round61-ufs-example-validation.log
            ${{ runner.temp }}/round63-phy-negative-validation.log
            ${{ runner.temp }}/*-validation.log
            ${{ runner.temp }}/*checkpatch.log
          if-no-files-found: warn
          retention-days: 14
