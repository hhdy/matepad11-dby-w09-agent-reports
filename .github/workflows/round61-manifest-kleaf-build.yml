name: ROUND61 manifest-pinned Kleaf target and Image build
on:
  push:
    branches: [ai-parallel/stagea-port-until-boot]
    paths: ["kernel-baseline/round61/run-manifest-kleaf-build.txt"]
permissions:
  contents: write
# Queue duplicate triggers; never cancel a healthy in-flight build.
concurrency:
  group: round61-manifest-kleaf-build
  cancel-in-progress: false
jobs:
  manifest-kleaf-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ACK_COMMIT: 8ad08f75ddf056e1ee600e1339e0463c5fcbdc9a
      MANIFEST_COMMIT: 46a1a5274ff0b40419952c861a8958bba5f28cfc
    steps:
      - name: Checkout dedicated implementation branch
        uses: actions/checkout@v4
        with:
          ref: ai-parallel/stagea-port-until-boot

      - name: "1/9 Preflight, dependencies and repo launcher"
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ack-6.18.33"
          ART="$RUNNER_TEMP/round61-artifacts"
          REPORT="$GITHUB_WORKSPACE"
          TMPDIR="$RUNNER_TEMP"
          {
            echo "WORK=$WORK"
            echo "ART=$ART"
            echo "REPORT=$REPORT"
            echo "TMPDIR=$TMPDIR"
          } >> "$GITHUB_ENV"
          mkdir -p "$ART" "$TMPDIR"
          nproc; free -h; cat /sys/fs/cgroup/memory.max || true; df -h "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev libncurses-dev libtinfo5 libxml2-utils python3-dev python3-venv rsync unzip zip curl git
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/repo"
          sudo install -m 0755 "$RUNNER_TEMP/repo" /usr/local/bin/repo
          repo --version
          git config --global user.name "ROUND61 Build Agent"
          git config --global user.email "round61-build@users.noreply.github.com"

      - name: "2/9 Repo init and immutable manifest sync"
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK"; cd "$WORK"
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android17-6.18 --repo-url=https://gerrit.googlesource.com/git-repo --depth=1
          test "$(git -C .repo/manifests rev-parse HEAD)" = "$MANIFEST_COMMIT"
          repo sync -c --no-tags --no-clone-bundle --optimized-fetch -j4 2>&1 | tee "$RUNNER_TEMP/round61-sync.log"

      - name: "3/9 Pin ACK source and record manifest"
        id: pin
        shell: bash
        run: |
          set -euo pipefail; cd "$WORK"
          git -C common fetch --depth=1 aosp refs/tags/android17-6.18.33_r00:refs/tags/android17-6.18.33_r00
          test "$(git -C common rev-parse refs/tags/android17-6.18.33_r00^{})" = "$ACK_COMMIT"
          git -C common checkout --detach "$ACK_COMMIT"
          test "$(git -C common rev-parse HEAD)" = "$ACK_COMMIT"
          test -z "$(git -C common status --porcelain)"
          repo manifest -r > "$ART/manifest-pinned.xml"
          sha256sum "$ART/manifest-pinned.xml" | tee "$ART/manifest-pinned.xml.sha256"
          git -C build/kernel rev-parse HEAD | tee "$ART/build-kernel.commit"
          if [ -f MODULE.bazel.lock ]; then sha256sum MODULE.bazel.lock > "$ART/MODULE.bazel.lock.sha256"; else echo "MODULE.bazel.lock absent before Bazel analysis" > "$ART/MODULE.bazel.lock.initial-state.txt"; fi
          ls -l tools/bazel build/kernel/kleaf/bazel.sh MODULE.bazel
          test -x tools/bazel

      - name: "4/9 Discover manifest-pinned JDK, Clang and Rust"
        id: toolchains
        shell: bash
        run: |
          set -euo pipefail; cd "$WORK"
          jdk_java="$(find -L prebuilts/jdk/jdk11 -type f -path '*/bin/java' -print -quit)"
          test -n "$jdk_java"; jdk_java="$(realpath "$jdk_java")"
          JAVA_HOME="$(dirname "$(dirname "$jdk_java")")"; test -x "$JAVA_HOME/bin/java"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version 2>&1 | tee "$ART/java-version.txt"
          tools/bazel version 2>&1 | tee "$ART/bazel-version.txt"
          constants_file="build/kernel/build.config.constants"
          if [ ! -f "$constants_file" ]; then constants_file="$(find build/kernel -type f -name build.config.constants -print -quit)"; fi
          test -n "$constants_file" && test -f "$constants_file"
          CLANG_VERSION="$(grep -m1 '^CLANG_VERSION=' "$constants_file" | cut -d= -f2- | tr -d '"')"
          RUSTC_VERSION="$(grep -m1 '^RUSTC_VERSION=' "$constants_file" | cut -d= -f2- | tr -d '"')"
          test -n "$CLANG_VERSION" && test -n "$RUSTC_VERSION"
          clang_dir="clang-${CLANG_VERSION#clang-}"
          clang_bin="$(find -L prebuilts/clang/host/linux-x86 -type f -path "*/$clang_dir/bin/clang" -print -quit)"
          rust_bin="$(find -L prebuilts/rust-toolchain/linux-x86 -type f -path "*/$RUSTC_VERSION/bin/rustc" -print -quit)"
          test -n "$clang_bin" && test -x "$clang_bin"; test -n "$rust_bin" && test -x "$rust_bin"
          clang_bin="$(realpath "$clang_bin")"; rust_bin="$(realpath "$rust_bin")"
          printf 'CLANG_VERSION=%s\nRUSTC_VERSION=%s\nCLANG_BIN=%s\nRUSTC_BIN=%s\n' "$CLANG_VERSION" "$RUSTC_VERSION" "$clang_bin" "$rust_bin" >> "$GITHUB_ENV"
          printf 'Kleaf-pinned Clang %s at %s\n' "$CLANG_VERSION" "$clang_bin" | tee "$ART/clang-version.txt"
          "$clang_bin" --version | tee -a "$ART/clang-version.txt"
          printf 'Kleaf-pinned Rust %s at %s\n' "$RUSTC_VERSION" "$rust_bin" | tee "$ART/rust-version.txt"
          "$rust_bin" --version | tee -a "$ART/rust-version.txt"

      - name: "5/9 Apply ordered UFS, ROUND63 PHY and Kleaf patches"
        id: patches
        shell: bash
        run: |
          set -euo pipefail
          apply_patch() { git -C "$WORK/common" apply --check "$1"; git -C "$WORK/common" apply "$1"; git -C "$WORK/common" diff --check; }
          echo "ROUND32/ROUND57 qcom,ufs.yaml edits are superseded: pinned ACK selects SM8250 in qcom,sc7180-ufshc.yaml."
          apply_patch "$REPORT/kernel-baseline/round36/0001-dt-bindings-ufs-allow-sm8250-dual-power-domains.patch.draft"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round52-0001-context-corrected.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round36-corrected-power-domain-range.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round32-corrected-sc7180-clock-names.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round33-checkpatch-clean.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round52-0002-checkpatch-clean.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round63-0002-qmp-ufs-phy-binding.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round63-0001-phy-qcom-qmp-ufs-always-on.patch"
          apply_patch "$REPORT/kernel-baseline/round61/patches/round58-kleaf-target.patch"
          git -C "$WORK/common" add -N arch/arm64/configs/dby_w09_storage_first.fragment
          git -C "$WORK/common" diff --check
          git -C "$WORK/common" diff --stat | tee "$ART/applied-source-diff-stat.txt"
          git -C "$WORK/common" diff --binary > "$ART/applied-source.diff"
          sha256sum "$ART/applied-source.diff" | tee "$ART/applied-source.diff.sha256"
          sha256sum "$WORK/common/arch/arm64/configs/dby_w09_storage_first.fragment" | tee "$ART/storage-first-fragment.sha256"

      - name: "6/9 Strict checkpatch, buildifier and config-helper tests"
        id: checks
        shell: bash
        run: |
          set -euo pipefail
          perl "$WORK/common/scripts/checkpatch.pl" --no-tree --no-signoff --strict < "$REPORT/kernel-baseline/round61/patches/round33-checkpatch-clean.patch"
          perl "$WORK/common/scripts/checkpatch.pl" --no-tree --no-signoff --strict < "$REPORT/kernel-baseline/round61/patches/round52-0002-checkpatch-clean.patch"
          perl "$WORK/common/scripts/checkpatch.pl" --no-tree --no-signoff --strict --ignore CAMELCASE < "$REPORT/kernel-baseline/round61/patches/round63-0001-phy-qcom-qmp-ufs-always-on.patch"
          go install github.com/bazelbuild/buildtools/buildifier@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          buildifier -mode=check "$WORK/common/BUILD.bazel"
          PYTHONPATH="$REPORT/kernel-baseline/round61" python3 -m unittest discover -s "$REPORT/kernel-baseline/round61/tests" -v 2>&1 | tee "$ART/config-helper-tests.log"

      - name: "7/9 Bazel query, cquery and output inventory"
        id: query
        shell: bash
        run: |
          set -euo pipefail; cd "$WORK"
          tools/bazel query //common:dby_w09 2>&1 | tee "$ART/bazel-query.log"
          tools/bazel cquery //common:dby_w09 --output=files 2>&1 | tee "$ART/cquery-output-files.txt"

      - name: "8/9 Build DBY-W09 Image"
        id: image
        shell: bash
        run: |
          set -euo pipefail; cd "$WORK"; set -o pipefail
          tools/bazel build --jobs=3 --verbose_failures //common:dby_w09 2>&1 | tee "$RUNNER_TEMP/round61-build.log"

      - name: "9/9 Validate final .config and hash kernel artifacts"
        id: validate
        shell: bash
        run: |
          set -euo pipefail; cd "$WORK"
          config="$(grep -E '(^|/)\.config$' "$ART/cquery-output-files.txt" | head -n 1)"
          image="$(grep -E '(^|/)Image$' "$ART/cquery-output-files.txt" | head -n 1)"
          system_map="$(grep -E '(^|/)System\.map$' "$ART/cquery-output-files.txt" | head -n 1)"
          vmlinux="$(grep -E '(^|/)vmlinux$' "$ART/cquery-output-files.txt" | head -n 1)"
          test -n "$config" && test -n "$image" && test -n "$system_map" && test -n "$vmlinux"
          case "$config" in /*) ;; *) config="$WORK/$config" ;; esac
          case "$image" in /*) ;; *) image="$WORK/$image" ;; esac
          case "$system_map" in /*) ;; *) system_map="$WORK/$system_map" ;; esac
          case "$vmlinux" in /*) ;; *) vmlinux="$WORK/$vmlinux" ;; esac
          PYTHONPATH="$REPORT/kernel-baseline/round61" python3 "$REPORT/kernel-baseline/round61/check_dby_w09_config.py" "$config" 2>&1 | tee "$ART/final-config-validation.txt"
          cp "$config" "$ART/dby_w09.config"; cp "$image" "$ART/Image"; cp "$system_map" "$ART/System.map"; cp "$vmlinux" "$ART/vmlinux"
          sha256sum "$ART/dby_w09.config" "$ART/Image" "$ART/System.map" "$ART/vmlinux" | tee "$ART/kernel-artifacts.sha256"
          stat -c '%n %s bytes' "$ART/Image" "$ART/dby_w09.config" "$ART/System.map" "$ART/vmlinux" | tee "$ART/kernel-artifacts.sizes.txt"
          if [ -f MODULE.bazel.lock ]; then sha256sum MODULE.bazel.lock > "$ART/MODULE.bazel.lock.final.sha256"; fi

      - name: Write complete stage summary
        if: always()
        shell: bash
        run: |
          set +e; mkdir -p "$ART"
          {
            echo "# ROUND61 hosted manifest/Kleaf build result"
            echo
            echo "- Date UTC: $(date -u +%FT%TZ)"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Trigger commit: $GITHUB_SHA"
            echo "- Workflow run ID: $GITHUB_RUN_ID"
            echo "- Manifest commit: $MANIFEST_COMMIT"
            echo "- ACK required commit: $ACK_COMMIT"
            echo "- Overall job status: ${{ job.status }}"
            echo
            echo "## Stage outcomes"
            echo "- Preflight: ${{ steps.preflight.outcome }}"
            echo "- Repo init/sync: ${{ steps.sync.outcome }}"
            echo "- ACK pin/manifest: ${{ steps.pin.outcome }}"
            echo "- Pinned toolchains: ${{ steps.toolchains.outcome }}"
            echo "- Patch application: ${{ steps.patches.outcome }}"
            echo "- Static checks/tests: ${{ steps.checks.outcome }}"
            echo "- Bazel query/cquery: ${{ steps.query.outcome }}"
            echo "- Image build: ${{ steps.image.outcome }}"
            echo "- Artifact validation: ${{ steps.validate.outcome }}"
            if [ -f "$ART/manifest-pinned.xml" ]; then
              echo; echo "## Source identity"
              git -C "$WORK/common" rev-parse HEAD 2>/dev/null || true
              git -C "$WORK/build/kernel" rev-parse HEAD 2>/dev/null || true
              sha256sum "$ART/manifest-pinned.xml" 2>/dev/null || true
            fi
            if [ -f "$RUNNER_TEMP/round61-build.log" ]; then echo; echo "## Build log tail"; tail -n 160 "$RUNNER_TEMP/round61-build.log" || true; fi
            if [ -f "$RUNNER_TEMP/round61-sync.log" ]; then echo; echo "## Repo sync log tail"; tail -n 80 "$RUNNER_TEMP/round61-sync.log" || true; fi
          } > "$RUNNER_TEMP/round61-result.md"

      - name: Publish build result to the dedicated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/round61-result.md" ]; then
            printf '# ROUND61 hosted manifest/Kleaf build result\n\nWorkflow run ID: %s\nNo result file was produced; runner terminated before the summary step completed.\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/round61-result.md"
          fi
          git checkout ai-parallel/stagea-port-until-boot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin ai-parallel/stagea-port-until-boot
            git reset --hard FETCH_HEAD
            existing_id="$(awk -F': ' '/Workflow run ID:/ { print $2; exit }' kernel-baseline/round61/hosted-build-latest.md 2>/dev/null || true)"
            if [[ "$existing_id" =~ ^[0-9]+$ ]] && (( existing_id > GITHUB_RUN_ID )); then echo "A newer hosted build result already exists (run $existing_id); leaving it intact."; exit 0; fi
            cp "$RUNNER_TEMP/round61-result.md" kernel-baseline/round61/hosted-build-latest.md
            git add kernel-baseline/round61/hosted-build-latest.md
            if [ -f "$ART/manifest-pinned.xml" ]; then
              cp "$ART/manifest-pinned.xml" kernel-baseline/round61/manifest-pinned.xml
              cp "$ART/manifest-pinned.xml.sha256" kernel-baseline/round61/manifest-pinned.xml.sha256
              git add kernel-baseline/round61/manifest-pinned.xml kernel-baseline/round61/manifest-pinned.xml.sha256
            fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "ROUND61: publish hosted manifest and Image build result"
            if git push origin HEAD:ai-parallel/stagea-port-until-boot; then exit 0; fi
            echo "Branch moved during publication; retrying ($attempt/3)."; sleep 2
          done
          exit 1

      - name: Upload pinned build evidence and Image artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round61-ack-6.18.33-image-build
          path: |
            ${{ runner.temp }}/round61-artifacts/
            ${{ runner.temp }}/round61-result.md
            ${{ runner.temp }}/round61-build.log
            ${{ runner.temp }}/round61-sync.log
          if-no-files-found: warn
          retention-days: 14
